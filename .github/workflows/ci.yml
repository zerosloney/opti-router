name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 允许手动触发

# 同分支并发时取消旧运行，省 CI 配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    # P2-6：专用临时 MariaDB——MariaDB 后端集成测试（配置 CAS/密钥多实例/花费增量等
    # OPTIROUTER_MARIADB_TEST 门控用例）在 CI 真实执行，而非缺库静默跳过计为 Passed。
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-pass
          MARIADB_DATABASE: optirouter_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OptiRouter.sln

      - name: Audit dependencies (CVE)
        # 供应链 P1：直接+传递依赖漏洞扫描，发现漏洞即失败（NuGet.org 漏洞库）。
        # dotnet list package --vulnerable 不支持 --fail-on-vulnerabilities（.NET 8 SDK 未实现），
        # 用 grep 匹配 "has no vulnerable packages" 作为通过信号。
        run: |
          set -euo pipefail
          for proj in src/OptiRouter/OptiRouter.csproj tests/OptiRouter.Tests/OptiRouter.Tests.csproj; do
            echo "Auditing $proj..."
            dotnet list "$proj" package --include-transitive --vulnerable | tee /dev/stderr \
              | grep -q "has no vulnerable packages" && echo "  OK: no vulnerabilities" \
              || { echo "::error::Vulnerable packages found in $proj"; exit 1; }
          done

      - name: Build
        # -warnaserror 在 CI 层强制零警告（与 csproj TreatWarningsAsErrors 一致）。
        run: dotnet build OptiRouter.sln -c Release --no-restore -warnaserror

      - name: Test
        # OPTIROUTER_MARIADB_TEST 指向服务容器中的专用临时库 optirouter_ci（与生产隔离；
        # 门控测试自建表与 scratch 库并自清理）。未设置时这些用例本地静默跳过
        # （xunit 2.9 无运行时 Skip，暂不引入 SkippableFact 依赖）。
        env:
          OPTIROUTER_MARIADB_TEST: "Server=127.0.0.1;Port=3306;Database=optirouter_ci;User ID=root;Password=ci-root-pass;Connection Timeout=15;Default Command Timeout=30"
        # coverlet（已在测试项目引用）收集 XPlat 覆盖率，结果在 TestResults/*/coverage.cobertura.xml。
        run: dotnet test OptiRouter.sln -c Release --no-build --verbosity minimal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    # 仅 push 到 master 时构建镜像（PR 单独由 build-test 覆盖，省配额）。
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        # 仅验证 Dockerfile 可构建，不打 tag 推送（无 registry 凭据配置）。
        run: docker build -t optirouter:ci .
