name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: # 允许手动触发

# 同分支并发时取消旧运行，省 CI 配额。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OptiRouter.sln

      - name: Audit dependencies (CVE)
        # 供应链 P1：直接+传递依赖漏洞扫描，发现漏洞即失败（NuGet.org 漏洞库）。
        # dotnet list package --vulnerable 不支持 --fail-on-vulnerabilities（.NET 8 SDK 未实现），
        # 用 grep 匹配 "has no vulnerable packages" 作为通过信号。
        run: |
          set -euo pipefail
          for proj in src/OptiRouter/OptiRouter.csproj tests/OptiRouter.Tests/OptiRouter.Tests.csproj; do
            echo "Auditing $proj..."
            dotnet list "$proj" package --include-transitive --vulnerable | tee /dev/stderr \
              | grep -q "has no vulnerable packages" && echo "  OK: no vulnerabilities" \
              || { echo "::error::Vulnerable packages found in $proj"; exit 1; }
          done

      - name: Build
        # -warnaserror 在 CI 层强制零警告（与 csproj TreatWarningsAsErrors 一致）。
        run: dotnet build OptiRouter.sln -c Release --no-restore -warnaserror

      - name: Test
        # coverlet（已在测试项目引用）收集 XPlat 覆盖率，结果在 TestResults/*/coverage.cobertura.xml。
        run: dotnet test OptiRouter.sln -c Release --no-build --verbosity minimal --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/TestResults/**/coverage.cobertura.xml'
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    # 仅 push 到 master 时构建镜像（PR 单独由 build-test 覆盖，省配额）。
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        # 仅验证 Dockerfile 可构建，不打 tag 推送（无 registry 凭据配置）。
        run: docker build -t optirouter:ci .
